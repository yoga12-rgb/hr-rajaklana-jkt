name: CI

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Check, test, database, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # CI validates a labelled demo build without accessing hosted data.
      PUBLIC_APP_ENV: development
      PUBLIC_SUPABASE_URL: ''
      PUBLIC_SUPABASE_ANON_KEY: ''
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check Svelte and TypeScript
        run: npm run check

      - name: Run unit tests
        run: npm test

      - name: Run Postgres migration and access tests
        run: npm run test:database

      - name: Check guarded legacy replacement
        run: npm run test:database:legacy

      - name: Build SPA and PWA
        run: npm run build
