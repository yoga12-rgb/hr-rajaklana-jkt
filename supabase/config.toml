project_id = "rajaklana-hr"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = []
jwt_expiry = 3600
enable_signup = false
minimum_password_length = 10

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.email]
# Keep email/password login available for employee numbers.
# Public registration remains disabled by [auth].enable_signup above.
enable_signup = true
enable_confirmations = true

[storage]
enabled = true
file_size_limit = "5MiB"

# Photo/document buckets use ordinary Storage on the Free plan.
[storage.vector]
enabled = false

[functions.hr-api]
verify_jwt = false

# This worker validates its dedicated wake-only header. It never accepts
# arbitrary recipients/messages, and all user-facing APIs retain Auth checks.
[functions.push-dispatch]
verify_jwt = false
